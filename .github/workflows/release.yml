name: Release

# Publicar una actualizacion queda en: actualizar VERSION, hacer commit, y
#   git tag vX.Y.Z && git push origin vX.Y.Z
# Este workflow arma el .exe y el instalador y los deja en un Release BORRADOR. Para que llegue a los
# usuarios, firmarlo y publicarlo desde tu PC:
#   py installer/firmar_release.py firmar vX.Y.Z
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14.4"

      - name: Verificar que VERSION coincide con el tag
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $version = (Get-Content VERSION -Raw).Trim()
          if ($tag -ne $version) {
            Write-Error "El tag (v$tag) no coincide con el archivo VERSION ($version) -- actualiza uno de los dos."
            exit 1
          }

      - name: Instalar dependencias (versiones exactas validadas para el build)
        run: pip install -r requirements-dev.txt

      - name: Construir con PyInstaller
        run: pyinstaller MisFinanzasPersonales.spec --noconfirm

      - name: Instalar Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Compilar instalador
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer\setup.iss

      - name: Calcular SHA256 del instalador
        shell: pwsh
        run: |
          $archivo = Get-ChildItem dist_installer\*.exe | Select-Object -First 1
          $hash = Get-FileHash $archivo.FullName -Algorithm SHA256
          "$($hash.Hash)  $($archivo.Name)" | Out-File "$($archivo.FullName).sha256" -Encoding ascii

      # Se publica como BORRADOR: las apps instaladas no lo ven (releases/latest ignora borradores) hasta
      # que el autor lo firme y lo publique desde su PC con `py installer/firmar_release.py firmar vX.Y.Z`.
      # La clave de firma nunca pasa por GitHub, asi que tomar control del repo no basta para distribuir
      # una actualizacion que las apps acepten.
      - name: Publicar Release (borrador, pendiente de firma)
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            dist_installer/*.exe
            dist_installer/*.sha256
          generate_release_notes: true
